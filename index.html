<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f6fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Study OS v7｜後西醫備考</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="appShell" class="app-shell">
  <aside class="sidebar">
    <button class="brand" data-nav="today" aria-label="回到 Today">
      <span class="brand-mark">S</span>
      <span><b class="display-font">Study OS</b><small>後西醫備考 · v7</small></span>
    </button>
    <nav class="side-nav" id="sideNav">
      <button class="nav-item active" data-nav="today" data-icon="home"><span class="nav-ico">⌂</span><span>Today</span></button>
      <button class="nav-item" data-nav="plan" data-icon="plan"><span class="nav-ico">◫</span><span>Plan</span></button>
      <button class="nav-item" data-nav="study" data-icon="study"><span class="nav-ico">▤</span><span>Study</span></button>
      <button class="nav-item" data-nav="insights" data-icon="insights"><span class="nav-ico">⌁</span><span>Insights</span></button>
      <button class="nav-item" data-nav="more" data-icon="more"><span class="nav-ico">•••</span><span>More</span></button>
    </nav>
    <div class="sidebar-foot">
      <button class="sync-card" id="syncBtnSide">
        <span class="sync-dot" id="syncDot"></span>
        <span><b id="syncStatus">Local ready</b><small id="lastSync">尚未雲端同步</small></span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-title">
        <p id="eyebrow">STUDY OS · TODAY</p>
        <h1 class="display-font" id="pageTitle">今天，只看下一步。</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" title="切換深色模式">◐</button>
        <button class="soft-btn desktop-only" id="syncBtn">同步</button>
        <button class="primary-btn" id="quickAddBtn">＋ 新增</button>
      </div>
    </header>

    <section class="view active" id="view-today"></section>
    <section class="view" id="view-plan"></section>
    <section class="view" id="view-study"></section>
    <section class="view" id="view-insights"></section>
    <section class="view" id="view-more"></section>
  </main>

  <nav class="mobile-nav" id="mobileNav">
    <button class="active" data-nav="today"><span>⌂</span><small>Today</small></button>
    <button data-nav="plan"><span>◫</span><small>Plan</small></button>
    <button data-nav="study"><span>▤</span><small>Study</small></button>
    <button data-nav="insights"><span>⌁</span><small>Insights</small></button>
    <button data-nav="more"><span>•••</span><small>More</small></button>
  </nav>

  <button class="fab" id="fabBtn" aria-label="快速新增">＋</button>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <section class="bottom-sheet" id="bottomSheet" aria-modal="true" role="dialog">
    <div class="sheet-grabber"></div>
    <div id="sheetContent"></div>
  </section>

  <div class="focus-layer" id="focusLayer" aria-hidden="true">
    <div class="focus-shell">
      <button class="focus-close" id="focusClose">×</button>
      <div class="focus-meta"><span id="focusSubject">Quick Focus</span><small id="focusTopic">結束後再紀錄內容</small></div>
      <div class="focus-clock display-font" id="focusClock">50:00</div>
      <div class="focus-progress"><i id="focusProgress"></i></div>
      <div class="focus-controls">
        <button class="focus-btn ghost" id="focusMinus">−5</button>
        <button class="focus-btn primary" id="focusPause">Pause</button>
        <button class="focus-btn ghost" id="focusPlus">+10</button>
      </div>
      <button class="text-btn danger" id="focusFinish">提前完成並記錄</button>
    </div>
  </div>

  <div class="toast" id="toast"><span id="toastText"></span><button id="toastUndo" hidden>UNDO</button></div>
</div>
<script src="app.js"></script>
</body>
</html>
